name: Security checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run lint
      - run: npm run build
        env:
          VITE_API_BASE_URL: https://api.example.invalid

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      # PYSEC-2026-1325: side-channel in the pure-Python `ecdsa` package, a
      # transitive dependency of python-jose. It has no fix release, and our
      # code never performs EC operations (app tokens use HS256; Firebase ID
      # tokens are verified with RS256 via `cryptography`), so it is not
      # reachable here. Revisit if `ecdsa` ships a fix or we drop python-jose.
      # CVE-2026-85394: python-jose HS256/public-key confusion, exploitable only
      # when jwt.decode() doesn't restrict algorithms. Both our decode calls do
      # (core/auth.py: HS256 for app tokens, RS256 for Firebase), and there is
      # no fix release. Revisit with the ecdsa exception above.
      - run: pip-audit -r requirements.txt --ignore-vuln PYSEC-2026-1325 --ignore-vuln CVE-2026-85394
      - run: bandit -r core dependencies middlewares routers schemas services -ll
      - run: pytest -q

  current-tree-secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject common credential formats
        shell: bash
        run: |
          credential_pattern='-----BEGIN (RSA |EC |OPENSSH )?PRIVATE'' KEY-----|AKIA[0-9A-Z]{16}|AIza[0-9A-Za-z_-]{30,}'
          if git grep -I -l -E -e "$credential_pattern" -- . ':!frontend/package-lock.json'; then
            echo 'Potential credential material found in the tracked tree.'
            exit 1
          fi
